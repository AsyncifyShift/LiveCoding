<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Live Code Playground</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=JetBrains+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Source+Code+Pro:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
:root{
  --bg:#f3f1ec; --panel:#fffefb; --ink:#23262e; --muted:#6c7080; --line:#d9d6cd;
  --accent:#2f5bea; --accent-ink:#fff; --edit:#fbfaf6; --console:#eceae3; --err:#c43d3d;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --c-kw:#7a3fc4; --c-str:#1a7f5a; --c-num:#b5560a; --c-tag:#b42f6f; --c-attr:#946200; --c-fn:#1f5fbf; --c-pun:#6c7080; --c-com:#8a8f9c;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15171c; --panel:#1d2027; --ink:#e6e8ee; --muted:#8b90a0; --line:#2e323c;
    --accent:#6f93ff; --accent-ink:#10131a; --edit:#191c22; --console:#14161b; --err:#ff7b7b; color-scheme:dark;
    --c-kw:#c39bff; --c-str:#7fd9a8; --c-num:#ffb36b; --c-tag:#ff8fb4; --c-attr:#e6c07b; --c-fn:#8fb4ff; --c-pun:#8b90a0; --c-com:#6f7585;
  }
}
:root[data-theme="dark"]{
  --bg:#15171c; --panel:#1d2027; --ink:#e6e8ee; --muted:#8b90a0; --line:#2e323c;
  --accent:#6f93ff; --accent-ink:#10131a; --edit:#191c22; --console:#14161b; --err:#ff7b7b; color-scheme:dark;
  --c-kw:#c39bff; --c-str:#7fd9a8; --c-num:#ffb36b; --c-tag:#ff8fb4; --c-attr:#e6c07b; --c-fn:#8fb4ff; --c-pun:#8b90a0; --c-com:#6f7585;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
h1{font:600 17px/1 Georgia,"Times New Roman",serif;margin:0 auto 0 0;letter-spacing:.2px}
button{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible,textarea:focus-visible,iframe:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.status{font-size:13px;color:var(--muted)}
#fname{font:inherit;font-size:14px;width:130px;color:var(--ink);background:var(--edit);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
#fname:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
.editor{display:flex;flex-direction:column;min-height:0;border-bottom:1px solid var(--line);background:var(--panel)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-radius:0;padding:10px 16px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.codewrap{position:relative;flex:1;min-height:0;background:var(--edit)}
textarea,#hl{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:14px;border:0;
  font:var(--fst,normal) var(--fw,400) var(--fs,13.5px)/var(--lh,1.55) var(--ff,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace);tab-size:2;white-space:pre}
textarea{resize:none;background:transparent;color:transparent;caret-color:var(--ink);overflow:auto;z-index:1}
textarea::selection{background:rgba(111,147,255,.35)}
#hl{overflow:hidden;pointer-events:none;color:var(--ink)}
#hl code{font:inherit}
textarea,#hl{padding-left:calc(var(--gw,2ch) + 20px)}
#hl{padding-bottom:40px}
#gutter{position:absolute;top:0;left:0;bottom:0;width:calc(var(--gw,2ch) + 12px);margin:0;padding:14px 6px 40px 0;overflow:hidden;
  text-align:right;font:var(--fst,normal) var(--fw,400) var(--fs,13.5px)/var(--lh,1.55) var(--ff,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace);white-space:pre;
  color:var(--muted);background:var(--panel);border-right:1px solid var(--line);z-index:2;pointer-events:none;user-select:none}
textarea,#hl,#gutter,#errlayer,.mirror{font-variant-ligatures:none}
textarea{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
.zoomtip{position:absolute;top:10px;right:14px;z-index:30;background:var(--ink);color:var(--panel);padding:4px 11px;border-radius:999px;font:600 13px system-ui,sans-serif;pointer-events:none;opacity:.92}
.zoomtip[hidden]{display:none}
.outonly{position:fixed;inset:0;z-index:60;background:#fff;display:flex;flex-direction:column}
.outonly[hidden]{display:none}
.outbar{display:flex;justify-content:flex-end;gap:8px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.outonly iframe{flex:1;min-height:0;width:100%;border:0;background:#fff}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);padding:16px}
.modal[hidden]{display:none}
.card{width:100%;max-width:380px;max-height:92%;overflow:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:14px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.card-head{display:flex;justify-content:space-between;align-items:center}
.card label{display:grid;gap:6px;font-size:14px}
.card .inline{display:flex;gap:20px}
.card .inline label{display:flex;align-items:center;gap:8px}
.card select{font:inherit;font-size:16px;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--edit);color:var(--ink)}
.card input[type=range]{width:100%;accent-color:var(--accent)}
.hint{margin:0;font-size:12.5px;color:var(--muted)}
.tabs button{flex:none}
#errlayer{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:14px 14px 40px calc(var(--gw,2ch) + 20px);border:0;
  font:var(--fst,normal) var(--fw,400) var(--fs,13.5px)/var(--lh,1.55) var(--ff,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace);tab-size:2;white-space:pre;overflow:hidden;pointer-events:none;color:transparent}
#errlayer code{font:inherit}
.squig{text-decoration:underline wavy #e5484d;text-decoration-color:#e5484d;text-decoration-thickness:1.5px;text-underline-offset:3px}
#gutter .gerr{color:#e5484d;background:rgba(229,72,77,.18);border-radius:3px;padding:0 2px}
.errbar{border-top:1px solid var(--line);background:rgba(229,72,77,.12);max-height:96px;overflow:auto}
.errrow{display:block;width:100%;text-align:left;border:0;border-radius:0;background:transparent;color:var(--err);padding:6px 12px;
  font:12.5px/1.4 ui-monospace,Menlo,Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.errbar[hidden]{display:none}
.pos{flex:1;min-width:0;align-self:center;padding:0 12px;text-align:right;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-kw{color:var(--c-kw)}.c-str{color:var(--c-str)}.c-num{color:var(--c-num)}.c-tag{color:var(--c-tag)}
.c-attr{color:var(--c-attr)}.c-fn{color:var(--c-fn)}.c-pun{color:var(--c-pun)}.c-com{color:var(--c-com)}
.preview{display:flex;flex-direction:column;min-height:0;min-width:0}
.preview iframe{flex:1;min-height:0;width:100%;border:0;background:#fff}
.console{height:28%;min-height:70px;border-top:1px solid var(--line);background:var(--console);display:flex;flex-direction:column}
.console-head{display:flex;justify-content:space-between;align-items:center;padding:4px 12px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line)}
.console-head button{padding:2px 8px;font-size:12px}
#log{flex:1;overflow:auto;margin:0;padding:8px 12px;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
#log .err{color:var(--err)}
.editor{position:relative}
#sug{position:absolute;z-index:20;min-width:150px;max-width:75%;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.2);padding:3px;font:13px/1.3 ui-monospace,Menlo,Consolas,monospace}
#sug div{padding:6px 10px;border-radius:4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sug div.on{background:var(--accent);color:var(--accent-ink)}
.mirror{position:absolute;top:0;left:-9999px;visibility:hidden;white-space:pre;overflow:hidden;box-sizing:border-box}
.mobilebar{display:none}
.preview[data-console="off"] .console{display:none}
@media (min-width:761px){
  :root{--fs:17px}
  main[data-layout="side"]{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
  main[data-layout="side"] .editor{border-bottom:0;border-right:1px solid var(--line)}
}
@media (max-width:760px){
  .status,#layout{display:none}
  main{grid-template-rows:minmax(0,1fr)}
  .editor{border-bottom:0}
  main[data-view="code"] .preview{display:none}
  main[data-view="preview"] .editor{display:none}
  .mobilebar{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 12px;border-top:1px solid var(--line);background:var(--panel)}
  .mobilebar button{padding:12px;font-size:15px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Live Code Playground</h1>
  <span class="status" id="status">Ready</span>
  <button id="run">Run</button>
  <input id="fname" type="text" value="my-page" placeholder="File name" aria-label="Download file name" maxlength="80" autocomplete="off">
  <button id="download">Download</button>
  <button id="reset">Reset</button>
  <button id="outBtn" title="Show only the output, full screen">Output only</button>
  <button id="consoleBtn" aria-pressed="false" title="Show or hide the console">Console</button>
  <button id="layout" title="Switch the editor and preview between top/bottom and side by side">Layout</button>
  <button id="settingsBtn">Settings</button>
</header>
<main data-view="code" data-layout="stack" id="main">
  <section class="editor" aria-label="Code editor">
    <div class="tabs" role="tablist">
      <button role="tab" id="t-html" aria-selected="true">HTML</button>
      <button role="tab" id="t-css" aria-selected="false">CSS</button>
      <button role="tab" id="t-js" aria-selected="false">JavaScript</button>
      <span id="pos" class="pos"></span>
    </div>
    <div class="codewrap" id="codewrap">
      <pre id="errlayer" aria-hidden="true"><code id="errcode"></code></pre>
      <pre id="hl" aria-hidden="true"><code id="hlcode"></code></pre>
      <pre id="gutter" aria-hidden="true"></pre>
      <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Code"></textarea>
      <div id="sug" role="listbox" hidden></div>
      <div id="zoomtip" class="zoomtip" hidden></div>
    </div>
    <div id="errbar" class="errbar" hidden></div>
  </section>
  <section class="preview" aria-label="Live preview" data-console="off">
    <iframe id="frame" title="Live preview" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>
    <div class="console">
      <div class="console-head"><span>Console</span><button id="clear">Clear</button></div>
      <pre id="log" aria-live="polite"></pre>
    </div>
  </section>
</main>
<nav class="mobilebar" aria-label="Switch view">
  <button id="toCode" class="primary">Code</button>
  <button id="toPreview">Preview</button>
</nav>
<div id="outonly" class="outonly" hidden>
  <div class="outbar"><button id="outClose" class="primary">Back to editor</button></div>
  <iframe id="outFrame" title="Output only" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>
</div>
<div id="settings" class="modal" hidden>
  <div class="card" role="dialog" aria-label="Editor settings">
    <div class="card-head"><strong>Editor settings</strong><button id="setClose">Close</button></div>
    <label>Theme
      <select id="setTheme"><option value="auto">Match my device</option><option value="light">Light</option><option value="dark">Dark</option></select>
    </label>
    <label><span>Font size: <span id="fsVal"></span></span>
      <input type="range" id="setSize" min="12" max="32" step="1">
    </label>
    <label>Font family
      <select id="setFont">
        <option value="mono">System monospace</option>
        <option value="consolas">Consolas</option>
        <option value="courier">Courier New</option>
        <option value="fira">Fira Code</option>
        <option value="jetbrains">JetBrains Mono</option>
        <option value="source">Source Code Pro</option>
      </select>
    </label>
    <label><span>Line spacing: <span id="lhVal"></span></span>
      <input type="range" id="setLh" min="1.2" max="2" step="0.05">
    </label>
    <div class="inline">
      <label><input type="checkbox" id="setBold"> Bold</label>
      <label><input type="checkbox" id="setItalic"> Italic</label>
    </div>
    <p class="hint" id="setHint"></p>
    <button id="setReset">Reset settings</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/acorn@8.11.3/dist/acorn.js"></script>
<script>
(function(){
  var DEFAULTS = {
    html: '<h1>Hello, world</h1>\n<p>Edit the code and watch this page update.</p>\n<button id="btn">Click me</button>\n<p id="count">Clicks: 0</p>',
    css: 'body {\n  font-family: system-ui, sans-serif;\n  margin: 0;\n  padding: 16px;\n  color: #23262e;\n}\nh1 { color: #2f5bea; }\nbutton {\n  padding: 8px 16px;\n  border: 0;\n  border-radius: 6px;\n  background: #2f5bea;\n  color: #fff;\n  font-size: 16px;\n  cursor: pointer;\n}',
    js: 'var n = 0;\nvar btn = document.getElementById("btn");\nvar out = document.getElementById("count");\n\nbtn.addEventListener("click", function () {\n  n++;\n  out.textContent = "Clicks: " + n;\n  console.log("Clicked", n, "times");\n});'
  };
  var KEY = "live-playground-v1";
  var state = clone(DEFAULTS), current = "html", timer = null, jsErrs = [], synErrs = [], runErrs = [], jsOffset = 0, jsPre = 0, jsLines = 0;

  try {
    var saved = localStorage.getItem(KEY);
    if (saved) { var p = JSON.parse(saved); if (p && typeof p.html === "string") state = p; }
  } catch (e) {}
  if (state.v !== 2) {
    state.css = state.css.replace("  max-width: 480px;\n  margin: 40px auto;\n  padding: 0 16px;\n", "  margin: 0;\n  padding: 16px;\n");
    state.v = 2;
  }

  function clone(o){ return { html:o.html, css:o.css, js:o.js, v:2 }; }
  var $ = function(id){ return document.getElementById(id); };
  var code = $("code"), frame = $("frame"), log = $("log"), status = $("status"), cbtn = $("consoleBtn"), errN = 0;

  function persist(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  function selectTab(name){
    state[current] = code.value;
    current = name;
    ["html","css","js"].forEach(function(n){ $("t-"+n).setAttribute("aria-selected", n === name); });
    code.value = state[name];
    paintHL();
    code.focus();
  }

  var bridge = '<script>(function(){function s(t,a){try{parent.postMessage({__pg:1,type:t,text:Array.prototype.map.call(a,function(x){if(typeof x==="object"){try{return JSON.stringify(x)}catch(e){return String(x)}}return String(x)}).join(" ")},"*")}catch(e){}}' +
    '["log","info","warn","error"].forEach(function(k){var o=console[k];console[k]=function(){s(k==="log"||k==="info"?"log":"err",arguments);o.apply(console,arguments)}});' +
    'window.addEventListener("error",function(e){try{parent.postMessage({__pg:1,type:"loc",line:e.lineno,col:e.colno,msg:e.message},"*")}catch(x){}});' +
    'window.addEventListener("unhandledrejection",function(e){s("err",["Unhandled promise rejection: "+e.reason])});})();<\/script>';

  function run(){
    state[current] = code.value;
    persist();
    clearLog();
    var head = '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">' +
      bridge + '<style>' + state.css + '<\/style></head><body>' + state.html + '<script>';
    jsOffset = head.split("\n").length - 1;
    jsPre = head.length - head.lastIndexOf("\n") - 1;
    jsLines = state.js.split("\n").length;
    runErrs = [];
    synErrs = findSyntax(state.js);
    jsErrs = synErrs.slice();
    paintHL();
    var doc = head + state.js.replace(/<\/script/gi, "<\\/script") + '<\/script></body></html>';
    frame.srcdoc = doc;
    status.textContent = "Updated " + new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit", second:"2-digit"});
  }

  function updateConsoleBtn(){
    cbtn.textContent = errN ? "Console (" + errN + ")" : "Console";
    cbtn.style.color = errN ? "var(--err)" : "";
  }
  function clearLog(){ log.textContent = ""; errN = 0; updateConsoleBtn(); }
  function addLog(text, isErr){
    var line = document.createElement("div");
    if (isErr) { line.className = "err"; errN++; updateConsoleBtn(); }
    line.textContent = text;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  }

  window.addEventListener("message", function(e){
    if (e.source !== frame.contentWindow || !e.data || !e.data.__pg) return;
    var d = e.data;
    if (d.type === "loc") {
      var ln = d.line - jsOffset;
      if (d.line > 0 && ln >= 1 && ln <= jsLines) {
        var m = String(d.msg || "Error");
        addLog("Line " + ln + ": " + m, true);
        if (!(synErrs.length && /SyntaxError/.test(m)) && !runErrs.some(function(x){ return x.line === ln && x.msg === m; })) {
          runErrs.push({ line: ln, col: ln === 1 ? d.col - jsPre : d.col, msg: m });
          jsErrs = synErrs.concat(runErrs).sort(function(a, b){ return a.line - b.line; });
          paintHL();
        }
      } else {
        addLog(String(d.msg || "Error") + (d.line > 0 ? " (page line " + d.line + ")" : ""), true);
      }
      return;
    }
    addLog(d.text, d.type === "err");
  });

  code.addEventListener("input", function(){
    state[current] = code.value;
    clearTimeout(timer);
    timer = setTimeout(run, 350);
  });

  code.addEventListener("keydown", function(e){
    if (sugKey(e)) return;
    if (e.key === "Tab" && !e.shiftKey) {
      e.preventDefault();
      var s = code.selectionStart, end = code.selectionEnd;
      code.value = code.value.slice(0, s) + "  " + code.value.slice(end);
      code.selectionStart = code.selectionEnd = s + 2;
      code.dispatchEvent(new Event("input"));
    }
  });

  ["html","css","js"].forEach(function(n){ $("t-"+n).addEventListener("click", function(){ selectTab(n); }); });
  $("run").addEventListener("click", run);
  $("clear").addEventListener("click", clearLog);
  $("reset").addEventListener("click", function(){
    if (!confirm("Reset all three files to the starter example?")) return;
    state = clone(DEFAULTS);
    code.value = state[current];
    paintHL();
    run();
  });


  function view(v){
    $("main").dataset.view = v;
    $("toCode").classList.toggle("primary", v === "code");
    $("toPreview").classList.toggle("primary", v === "preview");
  }
  $("toCode").addEventListener("click", function(){ view("code"); });
  $("toPreview").addEventListener("click", function(){ view("preview"); run(); });

  var dlBtn = $("download");
  function fullDoc(){
    state[current] = code.value;
    return '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>My Page</title>\n<style>\n' +
      state.css + '\n</style>\n</head>\n<body>\n' + state.html + '\n<script>\n' +
      state.js.replace(/<\/script/gi, "<\\/script") + '\n<\/script>\n</body>\n</html>\n';
  }
  var dlCap = null;
  if (window.claude && claude.use) {
    claude.use("downloads").then(function(dl){ dlCap = dl || null; }, function(){});
  }
  dlBtn.addEventListener("click", function(){
    var name = ($("fname").value || "").replace(/\.html?$/i, "").replace(/[\\\/:*?"<>|]/g, "").trim() || "my-page";
    name += ".html";
    if (dlCap) {
      dlCap.save({ filename: name, data: fullDoc() }).then(function(){
        status.textContent = "Downloaded " + name;
      }, function(err){
        if (err && err.code === "declined") return;
        status.textContent = "Download failed: " + ((err && err.message) || "unavailable");
      });
      return;
    }
    try {
      var url = URL.createObjectURL(new Blob([fullDoc()], { type: "text/html" }));
      var a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      status.textContent = "Downloaded " + name;
    } catch (e) {
      status.textContent = "Download failed: " + ((e && e.message) || "unavailable");
    }
  });
